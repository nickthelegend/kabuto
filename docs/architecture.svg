<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Urbanist, Helvetica, Arial, sans-serif">
  <rect width="1200" height="760" fill="#06070c"/>
  <text x="40" y="52" fill="#efeadf" font-size="26" font-weight="700">Kabuto architecture</text>
  <text x="40" y="80" fill="#9b98a8" font-size="15">One chain: the EF EIP-8141 / ERC-8421 alternative-mempool devnet (chain 1337) with Uniswap v4 predeployed</text>

  <!-- clients -->
  <g>
    <rect x="40" y="110" width="250" height="150" rx="18" fill="#0b0c13" stroke="#ffe9b0" stroke-opacity=".5"/>
    <text x="60" y="142" fill="#ffe9b0" font-size="17" font-weight="700">Kabuto DEX (browser)</text>
    <text x="60" y="168" fill="#b9b4cc" font-size="13">P256 owner key, local</text>
    <text x="60" y="188" fill="#b9b4cc" font-size="13">deploy + stake account</text>
    <text x="60" y="208" fill="#b9b4cc" font-size="13">protected swap (signs tx)</text>
    <text x="60" y="228" fill="#b9b4cc" font-size="13">sign intent (digest only)</text>
    <text x="60" y="248" fill="#6c6a78" font-size="12" font-family="Space Mono, monospace">@kabuto/sdk</text>
  </g>
  <g>
    <rect x="40" y="300" width="250" height="120" rx="18" fill="#0b0c13" stroke="#efeadf" stroke-opacity=".18"/>
    <text x="60" y="332" fill="#efeadf" font-size="17" font-weight="700">Intent relay</text>
    <text x="60" y="358" fill="#b9b4cc" font-size="13">untrusted, holds no funds</text>
    <text x="60" y="378" fill="#b9b4cc" font-size="13">intents self-authenticate</text>
    <text x="60" y="398" fill="#b9b4cc" font-size="13">SSE: posted / fills / refusals</text>
  </g>
  <g>
    <rect x="40" y="460" width="250" height="130" rx="18" fill="#0b0c13" stroke="#ffe9b0" stroke-opacity=".5"/>
    <text x="60" y="492" fill="#ffe9b0" font-size="17" font-weight="700">Fillers (anyone)</text>
    <text x="60" y="518" fill="#b9b4cc" font-size="13">quote via v4 Quoter</text>
    <text x="60" y="538" fill="#b9b4cc" font-size="13">build + co-sign + pay gas</text>
    <text x="60" y="558" fill="#b9b4cc" font-size="13">race by same-nonce fee bump</text>
    <text x="60" y="578" fill="#e5482e" font-size="12">attacker modes: refused</text>
  </g>
  <g>
    <rect x="40" y="630" width="250" height="90" rx="18" fill="#0b0c13" stroke="#e5482e" stroke-opacity=".6"/>
    <text x="60" y="662" fill="#ff9a8b" font-size="17" font-weight="700">Sandwich bot</text>
    <text x="60" y="688" fill="#b9b4cc" font-size="13">watches txpool + alt-mempool</text>
    <text x="60" y="706" fill="#b9b4cc" font-size="13">front-runs, back-runs</text>
  </g>

  <!-- mempools -->
  <g>
    <rect x="360" y="110" width="250" height="250" rx="18" fill="#0b0c13" stroke="#efeadf" stroke-opacity=".18"/>
    <text x="380" y="142" fill="#efeadf" font-size="17" font-weight="700">ERC-8421 alt-mempool</text>
    <text x="380" y="166" fill="#9b98a8" font-size="13">(sidecar node, gateway)</text>
    <text x="380" y="198" fill="#b9b4cc" font-size="13">simulates the VERIFY prefix</text>
    <text x="380" y="218" fill="#b9b4cc" font-size="13">staked accounts may read</text>
    <text x="380" y="238" fill="#b9b4cc" font-size="13">foreign storage (PoolManager)</text>
    <text x="380" y="258" fill="#b9b4cc" font-size="13">MAX_VERIFY_GAS 100k</text>
    <text x="380" y="278" fill="#b9b4cc" font-size="13">same-nonce replacement</text>
    <text x="380" y="310" fill="#e5482e" font-size="13">VERIFY fails = refused / Cancelled</text>
    <text x="380" y="330" fill="#e5482e" font-size="13">no inclusion, 0 gas</text>
  </g>
  <g>
    <rect x="360" y="400" width="250" height="100" rx="18" fill="#0b0c13" stroke="#efeadf" stroke-opacity=".18"/>
    <text x="380" y="432" fill="#efeadf" font-size="17" font-weight="700">ethrex (EIP-8141)</text>
    <text x="380" y="458" fill="#b9b4cc" font-size="13">builds blocks, re-runs VERIFY</text>
    <text x="380" y="478" fill="#b9b4cc" font-size="13">at inclusion time</text>
  </g>

  <!-- contracts -->
  <g>
    <rect x="680" y="110" width="480" height="610" rx="22" fill="#0b0c13" stroke="#ffe9b0" stroke-opacity=".35"/>
    <text x="704" y="144" fill="#ffe9b0" font-size="19" font-weight="700">On chain (chain 1337)</text>
    <rect x="704" y="166" width="432" height="150" rx="14" fill="rgba(239,234,223,.04)" stroke="#efeadf" stroke-opacity=".12"/>
    <text x="724" y="194" fill="#efeadf" font-size="16" font-weight="700">KabutoAccount (per user, staked)</text>
    <text x="724" y="218" fill="#b9b4cc" font-size="13" font-family="Space Mono, monospace">verifyPrice / verifyPriceExecution</text>
    <text x="724" y="238" fill="#b9b4cc" font-size="13" font-family="Space Mono, monospace">verifyIntent: explicit-msg sig +</text>
    <text x="724" y="258" fill="#b9b4cc" font-size="13" font-family="Space Mono, monospace">  every frame constrained</text>
    <text x="724" y="278" fill="#b9b4cc" font-size="13" font-family="Space Mono, monospace">settleIntent: Dutch-decayed minimum</text>
    <text x="724" y="298" fill="#6c6a78" font-size="12">APPROVE · SIGPARAM · TXPARAM · FRAMEPARAM · FRAMEDATACOPY</text>

    <rect x="704" y="330" width="208" height="120" rx="14" fill="rgba(239,234,223,.04)" stroke="#efeadf" stroke-opacity=".12"/>
    <text x="722" y="358" fill="#efeadf" font-size="15" font-weight="700">KabutoPaymaster</text>
    <text x="722" y="380" fill="#b9b4cc" font-size="12.5">staked; inspects frames;</text>
    <text x="722" y="398" fill="#b9b4cc" font-size="12.5">repaid from swap output</text>
    <text x="722" y="416" fill="#b9b4cc" font-size="12.5">in the same atomic batch</text>

    <rect x="928" y="330" width="208" height="120" rx="14" fill="rgba(239,234,223,.04)" stroke="#efeadf" stroke-opacity=".12"/>
    <text x="946" y="358" fill="#efeadf" font-size="15" font-weight="700">KabutoFiller</text>
    <text x="946" y="380" fill="#b9b4cc" font-size="12.5">pay(): operator co-sign</text>
    <text x="946" y="398" fill="#b9b4cc" font-size="12.5">fill(): DEFAULT frame,</text>
    <text x="946" y="416" fill="#b9b4cc" font-size="12.5">swaps through v4</text>

    <rect x="704" y="464" width="432" height="128" rx="14" fill="rgba(255,233,176,.07)" stroke="#ffe9b0" stroke-opacity=".4"/>
    <text x="724" y="492" fill="#ffe9b0" font-size="16" font-weight="700">Uniswap v4 (real mainnet bytecode)</text>
    <text x="724" y="516" fill="#b9b4cc" font-size="13">PoolManager: extsload(slot0) in VERIFY,</text>
    <text x="724" y="536" fill="#b9b4cc" font-size="13">unlock / swap / settle / take</text>
    <text x="724" y="556" fill="#b9b4cc" font-size="13">Quoter · StateView · WETH/kUSD pool</text>
    <text x="724" y="576" fill="#6c6a78" font-size="12">KabutoRouter: minimal unlock-callback router</text>

    <rect x="704" y="606" width="432" height="92" rx="14" fill="rgba(239,234,223,.04)" stroke="#efeadf" stroke-opacity=".12"/>
    <text x="724" y="634" fill="#efeadf" font-size="15" font-weight="700">ERC-8421 staking registry</text>
    <text x="724" y="656" fill="#b9b4cc" font-size="13">accounts + paymaster stake &gt; 0.01 ETH</text>
    <text x="724" y="676" fill="#b9b4cc" font-size="13">unlocks foreign-storage reads in VERIFY</text>
  </g>

  <!-- arrows -->
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9b98a8"/></marker></defs>
  <g stroke="#9b98a8" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M290 185 L358 200"/>
    <path d="M165 260 L165 298"/>
    <path d="M165 420 L165 458"/>
    <path d="M290 525 C330 525 330 300 358 290"/>
    <path d="M290 675 C335 675 335 470 358 460"/>
    <path d="M485 360 L485 398"/>
    <path d="M610 450 L678 450"/>
  </g>
</svg>
